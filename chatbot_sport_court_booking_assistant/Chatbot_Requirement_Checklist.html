<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbot Requirement Checklist</title>
<style>
:root{--ink:#343b48;--muted:#858b97;--line:#e9e7e3;--paper:#faf9f6;--purple:#8c79b1;--green:#739b83;--orange:#c3936b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #e1ded8;background:white;color:#555b68;border-radius:10px;padding:10px 14px;transition:.15s}button:hover{background:#f1eef6;border-color:#c7bdd8}button:focus-visible,input:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid #9d8aba;outline-offset:3px}button.primary{background:#615477;color:white;border-color:#615477}button.small{padding:7px 11px;font-size:12px}header{max-width:1530px;margin:auto;padding:40px 38px 24px}header .eyebrow{font-size:11px;letter-spacing:2px;color:#9486a7;font-weight:bold;margin-bottom:11px}h1{font-size:31px;letter-spacing:-.7px;margin:0 0 12px;font-weight:600}.intro{color:var(--muted);font-size:13px;line-height:1.8;margin:0}header .topline{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.save{margin:12px 0 0;text-align:right;color:#77927f;font-size:12px;min-height:18px}.workspace{max-width:1530px;margin:auto;padding:0 38px 40px}.overview{background:#f0edf4;border:1px solid #e7e0ee;border-radius:18px;padding:24px 28px;display:flex;gap:28px;align-items:center;margin-bottom:22px}.big{font-size:34px;font-weight:600;color:#665478;white-space:nowrap}.big span{font-size:15px;color:#9b91a7;font-weight:normal}.progress-title{display:flex;justify-content:space-between;gap:20px;font-size:13px;margin-bottom:11px}.progress-area{flex:1}.track{height:7px;background:#e2dce8;border-radius:9px;overflow:hidden}.bar{height:100%;background:#9985b7;transition:width .25s}.filters{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 20px}.search{width:330px;max-width:60%;padding:11px 15px;background:white;border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:13px}.filter{font-size:13px;color:#747a85;display:flex;align-items:center;gap:8px}.filter input{accent-color:#8c79b1;width:16px;height:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 15px #35302b03}.card-head{padding:23px 23px 18px;border-bottom:1px solid #f1eeea;background:var(--tint)}.section-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title{font-size:21px;font-weight:600;margin:0;letter-spacing:-.3px}.section-counter{font-size:12px;color:var(--accent);border-radius:20px;background:#ffffffa8;padding:6px 10px;white-space:nowrap}.section-caption{font-size:12px;color:#858590;margin:7px 0 16px}.card .track{height:4px;background:#ffffffbc}.card .bar{background:var(--accent)}.list{padding:8px 14px 6px}.item{padding:12px 9px;border-bottom:1px solid #f1f0ed}.item:last-child{border:0}.item-top{display:flex;align-items:flex-start;gap:10px}.check{appearance:none;flex:0 0 18px;width:18px;height:18px;border:1.5px solid #d6d4d9;border-radius:5px;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:white}.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked:after{content:'✓';font-size:13px;color:white;font-weight:bold}.label{font-size:13px;line-height:1.55;flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;padding:0 1px;border-radius:3px}.done .label{color:#a2a4aa;text-decoration:line-through}.row-actions{display:flex;gap:2px}.icon{padding:0;border:0;background:transparent;color:#b0aab9;width:23px;height:22px;font-size:14px;border-radius:5px}.icon.active{color:var(--accent);background:var(--tint)}.delete{opacity:0}.item:hover .delete,.delete:focus{opacity:1}.note{width:calc(100% - 28px);margin:10px 0 0 28px;border:1px solid #e8e3ee;background:#fcfbfe;border-radius:8px;resize:vertical;min-height:66px;padding:10px;font-size:12px;line-height:1.6;color:#626675}.add{margin:4px 23px 21px;display:flex;gap:8px}.add input{width:0;flex:1;border:1px dashed #ddd7e5;border-radius:9px;padding:10px 11px;font-size:12px;min-width:0}.add button{padding:9px 12px;background:var(--tint);border-color:transparent;color:var(--accent);font-size:13px}.empty{color:#a6a0ab;padding:25px 10px;text-align:center;font-size:13px}.foot{font-size:12px;color:#92909a;margin:22px 0 0;line-height:1.8}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4c4556;color:white;border-radius:12px;padding:13px 20px;font-size:13px;box-shadow:0 8px 30px #0002;z-index:5;max-width:90%}.toast[hidden]{display:none}.count-percent{color:#81718f}.screen-reader{position:absolute;left:-9999px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header .topline{flex-direction:column}.actions{justify-content:flex-start}.save{text-align:left}}@media(max-width:680px){header{padding:25px 18px 18px}.workspace{padding:0 18px 30px}h1{font-size:26px}.grid{grid-template-columns:1fr}.overview{padding:20px;gap:18px}.big{font-size:27px}.delete{opacity:1}.filters{align-items:flex-start;flex-direction:column}.search{width:100%;max-width:none}.actions button{font-size:12px;padding:9px 11px}}@media print{header{padding:10px}.workspace{padding:0}.actions,.save,.filters,.add,.row-actions,.foot{display:none}.grid{grid-template-columns:1fr}.card{break-inside:avoid;margin-bottom:15px}.label{color:black!important}.note{border:0}.overview{padding:15px}.item{padding:5px}.card-head{padding:15px}}
</style></head><body>
<header><div class="eyebrow">CHATBOT PROJECT</div><div class="topline"><div><h1 contenteditable="true" role="textbox" aria-label="编辑清单标题" id="title">Requirement Checklist</h1><p class="intro">逐项检查你的 System、Report 和 Video。点击项目文字即可编辑，使用右侧备注按钮记录证据或待办。</p></div><div><div class="actions"><button id="export">导出备份</button><button id="import">导入备份</button><button class="primary" id="download">下载当前清单</button></div><p id="save" class="save" role="status">正在加载…</p></div></div></header>
<main class="workspace"><section class="overview" aria-label="总体进度"><div id="total" class="big">0 <span>/ 44</span></div><div class="progress-area"><div class="progress-title"><span>总体完成进度</span><strong id="percent" class="count-percent">0%</strong></div><div class="track"><div id="overall-bar" class="bar" style="width:0"></div></div></div></section><div class="filters"><input type="search" class="search" id="search" aria-label="搜索清单项目" placeholder="搜索项目或备注…"><label class="filter"><input type="checkbox" id="incomplete">只显示未完成</label></div><div id="grid" class="grid"></div><p class="foot">勾选、文字和备注会自动保存在当前浏览器。换浏览器、移动文件或清除浏览器数据前，请先“导出备份”。<br>“下载当前清单”会生成包含当前内容和进度的独立 HTML 文件。截图中的要求已按原文保留，可按正式作业说明继续修改。</p></main>
<input type="file" id="file" accept="application/json,.json" hidden><div id="toast" class="toast" hidden role="status"></div>
<script id="initial-state" type="application/json">{"version":1,"id":"chatbot-requirement-checklist-2026","title":"Requirement Checklist","sections":[{"id":"system","name":"System","caption":"系统功能与实现","items":["Working Python program","Intent matching","Similarity-based matching","Identity management","Transaction dialogue","Multi-turn context","Slot collection","Validation","QA / information retrieval","Small talk","Discoverability","Error handling","Personalisation","Confirmation","Clear prompts","Necessary data included / correct paths","Comments explaining logic","Robust execution"]},{"id":"report","name":"Report","caption":"报告内容与格式","items":["Title","AI statement","Introduction","Architecture: what","Architecture: how","Architecture: why","Conversational design","Performance evaluation","Usability evaluation","Results","Discussion","Limitations","Application context","Figures / architecture diagram","Proper citations","≤ 2000 words (+/-10%)","ACM single-column format"]},{"id":"video","name":"Video","caption":"演示内容与录制","items":["≤ 5 min (+/-10%)","Live system use","Narration","Core features","Transaction","Error handling","Conversational design principles","Limitations","Clear audio/video"]}]}</script>
<script>
'use strict';
const seed=JSON.parse(document.getElementById('initial-state').textContent),KEY='requirement-checklist:'+seed.id;
let memoryOnly=false,timer,toastTimer;
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function normalise(x){if(!x||x.version!==1||!Array.isArray(x.sections)||!x.sections.length||x.sections.length>30)throw Error('不支持的备份格式');let count=0;return{version:1,id:typeof x.id==='string'?x.id:seed.id,title:String(x.title||'Requirement Checklist').slice(0,200),sections:x.sections.map(s=>{if(!s||!Array.isArray(s.items))throw Error('缺少清单项目');count+=s.items.length;if(count>10000)throw Error('项目过多');return{id:String(s.id||uid()),name:String(s.name||'Checklist').slice(0,100),caption:String(s.caption||'').slice(0,200),items:s.items.map(i=>typeof i==='string'?{id:uid(),text:i,done:false,note:''}:{id:String(i.id||uid()),text:String(i.text||'').slice(0,5000),done:i.done===true,note:String(i.note||'').slice(0,20000)})}})}}
let state=normalise(seed);try{const saved=localStorage.getItem(KEY);if(saved)state=normalise(JSON.parse(saved))}catch(e){memoryOnly=true}
const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000)}
function save(){clearTimeout(timer);try{localStorage.setItem(KEY,JSON.stringify(state));memoryOnly=false;$('save').textContent='已自动保存到此浏览器'}catch(e){memoryOnly=true;$('save').textContent='浏览器无法保存，请下载当前清单或导出备份';$('save').style.color='#b3835d'}}
function queueSave(){ $('save').textContent='正在保存…';clearTimeout(timer);timer=setTimeout(save,250)}
function progress(){const items=state.sections.flatMap(s=>s.items),done=items.filter(i=>i.done).length,pct=items.length?Math.round(done/items.length*100):0;$('total').replaceChildren(document.createTextNode(done+' '));const span=document.createElement('span');span.textContent='/ '+items.length;$('total').append(span);$('percent').textContent=pct+'%';$('overall-bar').style.width=pct+'%';for(const s of state.sections){const n=s.items.filter(i=>i.done).length;const c=document.querySelector('[data-counter="'+s.id+'"]');if(c)c.textContent=n+' / '+s.items.length;const b=document.querySelector('[data-bar="'+s.id+'"]');if(b)b.style.width=(s.items.length?n/s.items.length*100:0)+'%'}}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function singleLine(e){e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();e.blur()}});e.addEventListener('paste',ev=>{ev.preventDefault();const t=ev.clipboardData.getData('text/plain').replace(/[\r\n]+/g,' ');const sel=getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);r.deleteContents();const n=document.createTextNode(t);r.insertNode(n);r.setStartAfter(n);r.collapse(true);sel.removeAllRanges();sel.addRange(r);e.dispatchEvent(new Event('input'))})}
function render(){const q=$('search').value.trim().toLowerCase(),only=$('incomplete').checked;$('grid').replaceChildren();const palettes=[['#f0ebf7','#8c79b1'],['#eaf2ec','#739b83'],['#fbefe4','#c3936b']];state.sections.forEach((s,index)=>{const card=el('section','card');card.style.setProperty('--tint',palettes[index%3][0]);card.style.setProperty('--accent',palettes[index%3][1]);const head=el('div','card-head'),top=el('div','section-top'),heading=el('h2','section-title',s.name),counter=el('span','section-counter');counter.dataset.counter=s.id;top.append(heading,counter);const track=el('div','track'),bar=el('div','bar');bar.dataset.bar=s.id;track.append(bar);head.append(top,el('p','section-caption',s.caption),track);card.append(head);const list=el('div','list');const visible=s.items.filter(i=>(!only||!i.done)&&(!q||(i.text+' '+i.note).toLowerCase().includes(q)));if(!visible.length)list.append(el('div','empty',q?'没有匹配的项目':only?'这一组全部完成了':'还没有项目，添加一个吧'));
for(const item of visible){const row=el('div','item'+(item.done?' done':'')),line=el('div','item-top'),check=el('input','check');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','标记完成：'+item.text);const label=el('span','label',item.text);label.contentEditable='true';label.setAttribute('role','textbox');label.setAttribute('aria-label','编辑项目：'+item.text);singleLine(label);label.addEventListener('input',()=>{item.text=label.textContent;queueSave()});label.addEventListener('blur',()=>{item.text=label.textContent.trim()||'Untitled requirement';label.textContent=item.text;check.setAttribute('aria-label','标记完成：'+item.text);save()});check.addEventListener('change',()=>{item.done=check.checked;row.classList.toggle('done',item.done);save();if(only)render();else progress()});const actions=el('div','row-actions'),noteButton=el('button','icon'+(item.note?' active':''),'✎');noteButton.title='编辑备注';noteButton.setAttribute('aria-label','备注：'+item.text);noteButton.setAttribute('aria-expanded','false');const del=el('button','icon delete','×');del.title='删除项目';del.setAttribute('aria-label','删除：'+item.text);const note=el('textarea','note');note.value=item.note;note.placeholder='记录实现情况、测试证据、报告页码或待办…';note.setAttribute('aria-label','项目备注');note.hidden=true;noteButton.onclick=()=>{note.hidden=!note.hidden;noteButton.setAttribute('aria-expanded',String(!note.hidden));if(!note.hidden)note.focus()};note.addEventListener('input',()=>{item.note=note.value;noteButton.classList.toggle('active',Boolean(item.note));queueSave()});del.onclick=()=>{if(confirm('删除此项目？\n'+item.text)){s.items=s.items.filter(i=>i!==item);save();render()}};actions.append(noteButton,del);line.append(check,label,actions);row.append(line,note);list.append(row)}card.append(list);const add=el('form','add'),input=el('input');input.placeholder='添加新的检查项…';input.setAttribute('aria-label','在 '+s.name+' 添加项目');const btn=el('button','','添加');btn.type='submit';add.append(input,btn);add.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;s.items.push({id:uid(),text,done:false,note:''});save();$('search').value='';render()};card.append(add);$('grid').append(card)});progress()}
$('title').textContent=state.title;singleLine($('title'));$('title').addEventListener('input',()=>{state.title=$('title').textContent;queueSave()});$('title').addEventListener('blur',()=>{state.title=$('title').textContent.trim()||'Requirement Checklist';$('title').textContent=state.title;save()});$('search').addEventListener('input',render);$('incomplete').addEventListener('change',render);
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function stamp(){return new Date().toISOString().slice(0,10)}
$('export').onclick=()=>{save();download(new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),'Checklist_backup_'+stamp()+'.json');toast('备份已导出，包含全部勾选状态、文字和备注')};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error('文件过大');const imported=normalise(JSON.parse(await f.text()));if(!confirm('导入会替换当前清单。若有需要，请先导出当前备份。继续吗？'))return;state=imported;state.id=seed.id;$('title').textContent=state.title;$('search').value='';save();render();toast('已恢复清单')}catch(err){toast('无法导入：'+err.message)}finally{e.target.value=''}};
$('download').onclick=()=>{save();const snapshot=JSON.parse(JSON.stringify(state));snapshot.id=uid();const clone=document.documentElement.cloneNode(true);clone.querySelector('#initial-state').textContent=JSON.stringify(snapshot).replace(/</g,'\\u003c');clone.querySelector('#grid').replaceChildren();clone.querySelector('#toast').hidden=true;clone.querySelector('#search').value='';clone.querySelector('#save').textContent='正在加载…';download(new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),'Requirement_Checklist_'+stamp()+'.html');toast('已下载包含当前状态的独立清单，可复制到其他设备')};
render();save();
</script></body></html>
